<svg fill="none" viewBox="0 0 1200 360" width="100%" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1b2a" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="pillPassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillFailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="pillFlakyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes barGrow1 {
        0%, 100% { height: 42px; y: 158px; }
        50% { height: 65px; y: 135px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 60px; y: 140px; }
        50% { height: 35px; y: 165px; }
      }
      @keyframes barGrow3 {
        0%, 100% { height: 50px; y: 150px; }
        50% { height: 75px; y: 125px; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes blinkLight {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .glow-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .floating-card-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-card-2 { animation: floatReverse 6s ease-in-out infinite; }
      .pulse-dot { animation: blinkLight 2s ease-in-out infinite; }
      .bar-1 { animation: barGrow1 4s ease-in-out infinite; }
      .bar-2 { animation: barGrow2 4.5s ease-in-out infinite; }
      .bar-3 { animation: barGrow3 3.8s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 6 4; animation: dashAnim 3s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Dynamic Glow Orbs in Deep Background -->
  <circle cx="200" cy="90" r="140" fill="#3b82f6" filter="url(#glow)" class="glow-orb" />
  <circle cx="1020" cy="180" r="160" fill="#8b5cf6" filter="url(#glow)" class="glow-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="300" r="120" fill="#06b6d4" filter="url(#glow)" class="glow-orb" style="animation-delay: -1.5s;" />

  <!-- Animated Data Flow Line in Background -->
  <path d="M 60 290 Q 250 260 400 295 T 800 270 T 1140 285" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.45" class="flow-line" />

  <!-- Background Animated Dashboard Widgets (Flanking Sides - Safe from Center Title) -->
  
  <!-- Left Side: Mini Test Stream Activity Card -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="45" y="70" width="170" height="150" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    <circle cx="65" cy="92" r="5" fill="#10b981" class="pulse-dot" />
    <text x="80" y="96" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LIVE TEST RUN</text>
    
    <!-- Mini Histogram / Telemetry Bars -->
    <rect x="65" y="158" width="16" height="42" rx="4" fill="#10b981" opacity="0.85" class="bar-1" />
    <rect x="90" y="140" width="16" height="60" rx="4" fill="#3b82f6" opacity="0.85" class="bar-2" />
    <rect x="115" y="150" width="16" height="50" rx="4" fill="#8b5cf6" opacity="0.85" class="bar-3" />
    <rect x="140" y="165" width="16" height="35" rx="4" fill="#f59e0b" opacity="0.85" />
    <rect x="165" y="130" width="16" height="70" rx="4" fill="#10b981" opacity="0.85" class="bar-1" />

    <text x="65" y="122" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">99.4% PASS</text>
  </g>

  <!-- Right Side: Mini Health & Flakiness Card -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="980" y="75" width="175" height="150" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5" />
    <circle cx="1000" cy="97" r="5" fill="#6366f1" class="pulse-dot" style="animation-delay: -1s;" />
    <text x="1015" y="101" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">QUALITY GATES</text>
    
    <!-- Status Badges inside card -->
    <rect x="1000" y="115" width="135" height="24" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
    <text x="1010" y="131" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✔ CI Pipelines: Passed</text>
    
    <rect x="1000" y="148" width="135" height="24" rx="6" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-width="1" />
    <text x="1010" y="164" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Flaky Tests: 0 Detected</text>
    
    <rect x="1000" y="181" width="135" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1" />
    <text x="1010" y="197" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔍 AI Triage: Real-Time</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed High Contrast & Clarity -->

  <!-- Top Pill: Category Tag -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="-116" cy="0" r="4" fill="#38bdf8" class="pulse-dot" />
    <text x="-104" y="4" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
    Unified Test Reporting &amp; Dashboards
  </text>

  <!-- Subtitle -->
  <text x="600" y="165" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
    Aggregated Analytics, TestOps &amp; Real-Time Insights for CI/CD Quality Engineering
  </text>

  <!-- Tagline / Framework Highlights -->
  <text x="600" y="195" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
    Playwright • Cypress • Selenium • Pytest • JUnit • TestNG • GitHub Actions
  </text>

  <!-- Interactive Framework & Feature Pills (Foreground) -->
  <g transform="translate(600, 240)">
    <!-- Pill 1: Real-time Ingestion -->
    <g transform="translate(-250, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Real-Time Streaming</text>
    </g>

    <!-- Pill 2: AI Triage -->
    <g transform="translate(-85, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI Failure Triage</text>
    </g>

    <!-- Pill 3: Flakiness Tracking -->
    <g transform="translate(75, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🎯 Flaky Detection</text>
    </g>

    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(240, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 SaaS &amp; Self-Hosted</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#titleGrad)" />
</svg>
